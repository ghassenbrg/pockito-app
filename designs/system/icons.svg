<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<!--
  Pockito icon set — 24×24 grid, 2px stroke, round caps and joins.
  Style follows Material Symbols Rounded, matching life-os-mobile's Flutter `Icons.*` usage
  (outlined for objects, rounded for chrome). Drawn as strokes so one set serves every
  size and colour; `.pk-icon--fill` variants exist only where a filled mark is required
  (active nav, category circles).

  Usage:  <svg class="pk-icon"><use href="icons.svg#i-home"/></svg>
-->

