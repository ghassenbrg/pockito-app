apiVersion: v1
kind: Service
metadata:
  name: pockito-core
  namespace: pockito
spec:
  selector:
    app: pockito-core
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pockito-core
  namespace: pockito
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pockito-core
  template:
    metadata:
      labels:
        app: pockito-core
    spec:
      containers:
        - name: pockito-core
          image: ghassenbrg/pockito-core:1.0.0
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: pockito-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pockito-postgres
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pockito-redis
                  key: REDIS_PASSWORD
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: pockito-object-storage
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: pockito-object-storage
                  key: S3_SECRET_KEY
            - name: DIFY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pockito-dify
                  key: DIFY_API_KEY
            - name: TZ
              value: Asia/Tokyo
          # Flyway runs at start-up, so the first boot on an empty database is
          # slower than the steady state. The startup probe absorbs that instead
          # of the liveness probe killing the migration half-way.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 3
          # Liveness deliberately checks only the process, not its dependencies:
          # a Postgres blip should take Core out of rotation, not restart it.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
