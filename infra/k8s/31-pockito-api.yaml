# Pockito API: the REST front door. Stateless, so it scales horizontally
# without coordination; it holds no session and owns no business rule.
apiVersion: v1
kind: Service
metadata:
  name: pockito-api
  namespace: pockito
spec:
  selector:
    app: pockito-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pockito-api
  namespace: pockito
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pockito-api
  template:
    metadata:
      labels:
        app: pockito-api
    spec:
      containers:
        - name: pockito-api
          image: ghassenbrg/pockito-api:1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: pockito-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"

            - name: TZ
              value: Asia/Tokyo
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              memory: 768Mi
