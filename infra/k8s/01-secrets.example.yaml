# Template only. Copy to `01-secrets.yaml`, replace every value, and keep that
# file out of Git — `infra/k8s/.gitignore` already excludes it.
#
# Generate strong values, for example:
#   openssl rand -base64 32
apiVersion: v1
kind: Secret
metadata:
  name: pockito-postgres
  namespace: pockito
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: pockito-redis
  namespace: pockito
type: Opaque
stringData:
  REDIS_PASSWORD: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: pockito-object-storage
  namespace: pockito
type: Opaque
stringData:
  # These are the SeaweedFS S3 identity below and Pockito Core's client
  # credentials; both sides read this one secret so they cannot drift.
  S3_ACCESS_KEY: "REPLACE_ME"
  S3_SECRET_KEY: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: pockito-dify
  namespace: pockito
type: Opaque
stringData:
  # Issued from the Dify console. Leave empty and set DIFY_ENABLED=false until
  # an AI workflow actually needs it.
  DIFY_API_KEY: ""
