# Notification worker: consumes the Redis Stream Pockito Core publishes to.
# Separate from the API so slow or failing push delivery can never add
# latency to a user-facing request.
apiVersion: v1
kind: Service
metadata:
  name: pockito-notification-worker
  namespace: pockito
spec:
  selector:
    app: pockito-notification-worker
  ports:
    - name: http
      port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pockito-notification-worker
  namespace: pockito
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pockito-notification-worker
  template:
    metadata:
      labels:
        app: pockito-notification-worker
    spec:
      containers:
        - name: pockito-notification-worker
          image: ghassenbrg/pockito-notification-worker:1.0.0
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: pockito-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pockito-redis
                  key: REDIS_PASSWORD
            # Names this replica's Redis Streams consumer, so pending events
            # can be attributed and reclaimed after a crash.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TZ
              value: Asia/Tokyo
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              memory: 768Mi
