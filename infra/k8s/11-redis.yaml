apiVersion: v1
kind: Service
metadata:
  name: pockito-redis
  namespace: pockito
spec:
  selector:
    app: pockito-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pockito-redis-data
  namespace: pockito
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pockito-redis
  namespace: pockito
spec:
  serviceName: pockito-redis
  replicas: 1
  selector:
    matchLabels:
      app: pockito-redis
  template:
    metadata:
      labels:
        app: pockito-redis
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          # Redis holds the notification stream. An unacknowledged event that is
          # lost on restart is a notification that never arrives, so AOF is on
          # even though the cache side would not need it.
          command:
            - sh
            - -c
            - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pockito-redis
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pockito-redis-data
