parent=keycloak.v2
import=common/keycloak

# Keep Keycloak's version-matched PatternFly foundations, then apply Pockito's
# product tokens and component layer. Parent resources resolve through the
# active theme URL, so the first stylesheet remains owned by Keycloak 26.
styles=css/styles.css css/pockito.css
stylesCommon=vendor/patternfly-v5/patternfly.min.css vendor/patternfly-v5/patternfly-addons.css

# Keycloak's template uses prefers-color-scheme and toggles kcDarkModeClass.
darkMode=true

# Product links rendered by the shared authentication footer. Deployments may
# override these properties without changing templates.
pkHelpUrl=https://pockito.ghassen.io/help
pkPrivacyUrl=https://pockito.ghassen.io/privacy
pkTermsUrl=https://pockito.ghassen.io/terms
pkSecurityUrl=https://pockito.ghassen.io/security
